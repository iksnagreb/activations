# List experiment stages, i.e., the jobs to be run
stages:
  # Stage preparing the model form the configuration
  setup:
    # Stage run the setup script as the command
    cmd: python -m export
    # Dependencies of this stage to determine when it needs to be rerun
    deps:
      # The scripts used to execute the stage
      - export.py
      - activations.py
      - utils.py
    # Parameters used by this stage
    params:
      # Track the model and export hyperparameter sections from the parameters
      - model
      - export
      - seed
      - shape
      - range
      - calibration_passes
    # Outputs produced by this stage, which should be tracked and passed on to
    # the next stage
    outs:
      # The model exported as ONNX
      - model.onnx
      # Input/Output pair in numpy format for verification during the build
      - inp.npy
      - out.npy
  # Stage running the finn build of the model configured in parameters
  build:
    # Command running a finn build of the model produced during setup
    #   Note: More options should be provided via environment variables
    cmd: bash run.sh '$FINN/run-docker.sh build_custom $(pwd)'
    # Dependencies of this stage to determine when it needs to be rerun
    deps:
      # Run scripts orchestrating the script execution (potentially via sbatch)
      - run.sh
      - noctua.sh
      # The script executing the stage
      - build.py
      # The custom build steps implemented in this package
      - build_steps.py
      - quant_to_multithreshold.py
      - utils.py
      # Implementation details of the new custom build steps
      - custom/apply_config.py
      - custom/ints.py
      # The model export produced by the setup stage: This triggers rerunning
      # this stage when the model configuration changes
      - model.onnx
      # Input/Output pair in numpy format for verification during the build
      - inp.npy
      - out.npy
    # Parameters used by this stage
    params:
      # Track the input shape, RNG-seed and build section from the parameter
      # file
      - shape
      - range
      - seed
      - prepare
      - build
      # Folding configurations specifying parallelization and FIFO sizes for the
      # layers/operators
      - ${build.folding_config_file}:
      # Configuration file specifying the preferred implementation style of
      # custom operators
      - ${build.specialize_layers_config_file}:
      # Optional fixed-point quantization configuration
      - ${build.fixedpt_config}:
    # Outputs produced by this stage, which should be tracked and passed on to
    # the next stage
    outs:
      # Track everything from the build directory
      - ${build.output_dir}/
#    # Produces metrics as output
#    metrics:
#      # Estimates of cycles, throughput, latency
#      - ${build.output_dir}/report/estimate_network_performance.json:
#          # Keep the metrics tracked by git
#          cache: false
#      # RTL simulation of cycles, throughput, latency
#      - ${build.output_dir}/report/rtlsim_performance.json:
#          # Keep the metrics tracked by git
#          cache: false
  # Stage collecting the synthesis metrics from the build stage
  metrics:
    # Command aggregating metrics from the build output products
    cmd: |
      # Copy metrics out of the build directory
      cp ${build.output_dir}/report/estimate_network_performance.json .
      cp ${build.output_dir}/report/rtlsim_performance.json .
      # Run python script for aggregating from the ${metrics.report} file
      python -m metrics
    # Dependencies of this stage to determine when it needs to be rerun
    deps:
      # The script executing the stage
      - metrics.py
      # The output products of the previous stage
      - ${build.output_dir}/
      # The raw report file produced by finn
      - ${metrics.report}
    # Parameters used by this stage
    params:
      # Track the build section from the parameter file
      - build.output_dir
      # Track the metrics section from the parameter file
      - metrics
    # Produces metrics as output
    metrics:
      # Aggregated metrics from the ${metrics.report} file
      - metrics.yaml:
          # Keep the metrics tracked by git
          cache: false
      # Per category metrics breakdown from the ${metrics.report} file
      - breakdown.yaml:
          # Keep the metrics tracked by git
          cache: false
      # Estimates of cycles, throughput, latency, ...
      - estimate_network_performance.json:
          # Keep the metrics tracked by git
          cache: false
      # RTL simulation measurement of cycles, throughput, latency, ...
      - rtlsim_performance.json:
          # Keep the metrics tracked by git
          cache: false
  # Stage checking the verification output of the FINN dataflow build
  verify:
    # Command summarizing verification outputs from the build output products
    cmd: python -m verify
    # Dependencies of this stage to determine when it needs to be rerun
    deps:
      # The script executing the stage
      - verify.py
      # The output products of the previous stage
      - ${build.output_dir}/verification_output/
    # Parameters used by this stage
    params:
      # Track the build section from the parameter file
      - build.output_dir
    # Produces metrics as output
    metrics:
      # Track all metrics in this file
      - verification.yaml:
          # Keep the output tracked by git
          cache: false
